name: LCAN-View Auto Build and Release

on:
  push:
    tags:
      - "v*" # 当推送 v1.1.0 这样的标签时触发

jobs:
  build:
    runs-on: windows-latest # 必须在 Windows 虚拟机上运行
    permissions:
      contents: write

    steps:
      - name: Checkout Private Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Cache Nuitka dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/Nuitka
            AppData/Local/Nuitka/Nuitka
          key: ${{ runner.os }}-nuitka-${{ hashFiles('**/requirements.txt') }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE with Nuitka
        shell: pwsh
        run: |
          $env:PYTHONPATH = ".;libs"

          python -m nuitka `
            --standalone `
            --onefile `
            --enable-plugin=pyqt6 `
            --windows-console-mode=disable `
            --remove-output `
            --jobs=4 `
            --assume-yes-for-downloads `
            --output-filename="LCAN-View_${{ github.ref_name }}.exe" `
            --windows-icon-from-ico="LCAN-View.ico" `
            --follow-imports `
            up2.py

      - name: Create Release in Public Repo
        uses: softprops/action-gh-release@v2
        with:
          repository: Choosen123/LCAN-View-Release
          token: ${{ secrets.MY_RELEASE_TOKEN }}
          files: LCAN-View_${{ github.ref_name }}.exe
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## 更新日志
            - 自动构建版本: ${{ github.ref_name }}
            - 提交信息: ${{ github.event.head_commit.message }}
          draft: false
          prerelease: false

      - name: Update version.json in Public Repo
        shell: bash
        env:
          PUBLIC_REPO: Choosen123/LCAN-View-Release
          MY_TOKEN: ${{ secrets.MY_RELEASE_TOKEN }}
        run: |
          # 0. 获取最新的提交信息作为 changelog
          RAW_CHANGELOG=$(git log -1 --pretty=%B)
          export RAW_CHANGELOG

          # 1. 克隆公共仓库到临时目录
          git clone https://x-access-token:${MY_TOKEN}@github.com/${PUBLIC_REPO}.git public_repo
          cd public_repo

          # 2. 使用 Python 脚本生成新的 version.json
          # 这里的 URL 构造逻辑要与上面打包的文件名对应
          python <<EOF
          import json
          new_version = "${{ github.ref_name }}".replace('v', '')
          changelog = os.getenv('RAW_CHANGELOG', 'No changelog available.')
          download_url = f"https://github.com/${PUBLIC_REPO}/releases/download/${{ github.ref_name }}/LCAN-View_${{ github.ref_name }}.exe"

          data = {
              "version": new_version,
              "url": download_url,
              "changelog": changelog.strip()
          }

          with open('version.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, indent=4, ensure_ascii=False)
          EOF

          # 3. 提交并推送更改
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "Update version.json for ${{ github.ref_name }}"
          git push origin main
