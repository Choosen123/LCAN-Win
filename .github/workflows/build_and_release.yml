name: LCAN-View Auto Build and Release

on:
  push:
    tags:
      - "v*" # 当推送 v1.1.0 这样的标签时触发

jobs:
  build:
    runs-on: windows-latest # 必须在 Windows 虚拟机上运行
    permissions:
      contents: write

    steps:
      - name: Checkout Private Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pybind11
          pip install -r requirements.txt

      - name: Install MSVC and CMake
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build C++ Extension (.pyd)
        shell: pwsh
        run: |
          mkdir build
          cd build
          cmake .. -G "Visual Studio 17 2022" -A x64 `
            -DPython_EXECUTABLE="$((Get-Command python).Source)"
          cmake --build . --config Release

          cd ..
          if (!(Test-Path "libs")) { New-Item -ItemType Directory -Path "libs" }
          copy build/Release/gs_usb.pyd libs/

      - name: Build EXE with PyInstaller
        shell: pwsh
        run: |
          $EXE_NAME = "LCAN-View_${{ github.ref_name }}"

          # 执行 PyInstaller
          pyinstaller --onefile `
            --name "$EXE_NAME" `
            --icon="LCAN-View.ico" `
            --add-binary "libs/gs_usb.pyd;." `
            --clean `
            up2.py

      - name: Create Release in Public Repo
        uses: softprops/action-gh-release@v2
        with:
          repository: Choosen123/LCAN-View-Release
          token: ${{ secrets.MY_RELEASE_TOKEN }}
          files: dist/LCAN-View_${{ github.ref_name }}.exe
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## 更新日志
            - 自动构建版本: ${{ github.ref_name }}
            - 提交信息: ${{ github.event.head_commit.message }}
          draft: false
          prerelease: false

      - name: Update version.json in Public Repo
        shell: bash
        env:
          PUBLIC_REPO: Choosen123/LCAN-View-Release
          MY_TOKEN: ${{ secrets.MY_RELEASE_TOKEN }}
        run: |
          # 0. 获取最新的提交信息作为 changelog
          RAW_CHANGELOG=$(git log -1 --pretty=%B)
          export RAW_CHANGELOG

          # 1. 克隆公共仓库到临时目录
          git clone https://x-access-token:${MY_TOKEN}@github.com/${PUBLIC_REPO}.git public_repo
          cd public_repo

          # 2. 使用 Python 脚本生成新的 version.json
          # 这里的 URL 构造逻辑要与上面打包的文件名对应
          python <<EOF
          import json
          import os
          new_version = "${{ github.ref_name }}".replace('v', '')
          changelog = os.getenv('RAW_CHANGELOG', 'No changelog available.')
          download_url = f"https://github.com/${PUBLIC_REPO}/releases/download/${{ github.ref_name }}/LCAN-View_${{ github.ref_name }}.exe"

          data = {
              "version": new_version,
              "url": download_url,
              "changelog": changelog.strip()
          }

          with open('version.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, indent=4, ensure_ascii=False)
          EOF

          # 3. 提交并推送更改
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "Update version.json for ${{ github.ref_name }}"
          git push origin main
